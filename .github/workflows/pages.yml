name: Deploy ASTROLENZA Visor to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '02_Final_Visor_Prototype/**'
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  verify-release:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.release-check.outputs.ready }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Verify visor module exists
        id: release-check
        shell: bash
        run: |
          if [[ -f 02_Final_Visor_Prototype/ASTROLENZA_Visor_v19.html && -f index.html ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Visor module or landing page is missing; deployment skipped."
          fi

  deploy:
    needs: verify-release
    if: needs.verify-release.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Configure and enable GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy static site
        id: deployment
        uses: actions/deploy-pages@v4
