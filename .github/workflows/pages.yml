name: Deploy ASTROLENZA to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '01_Submission_Demo/**'
      - '02_Final_Visor_Prototype/**'
      - '03_Source_and_Engineering_Notes/**'
      - '04_Visual_Evidence/**'
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Verify release payload is present
        run: |
          test -f 02_Final_Visor_Prototype/ASTROLENZA_Visor_v19.html
          test -f 01_Submission_Demo/ASTROLENZA_Mission_Intelligence_Briefing_v19.html
          test -f 01_Submission_Demo/ASTROLENZA_Mission_Intelligence_Briefing_v19.pdf
          test -f index.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy static site
        id: deployment
        uses: actions/deploy-pages@v4
